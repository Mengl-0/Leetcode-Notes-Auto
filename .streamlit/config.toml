# Streamlit theme config (phase 4)
# Initial mode follows the OS preference automatically (no base set here).
# Users can customize via top-right menu: Settings -> Theme (saved per browser).
# Reading-oriented palette: calm blue primary, soft card surface, dark code blocks.

[theme]
primaryColor = "#2f6db3"
font = "sans-serif"
showSidebarBorder = true
baseRadius = "medium"

[theme.light]
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2937"
codeBackgroundColor = "#1e2a3a"
codeTextColor = "#e2e8f0"
linkColor = "#2f6db3"
borderColor = "#d4dae3"

[theme.dark]
backgroundColor = "#0f1419"
secondaryBackgroundColor = "#16202b"
textColor = "#e6edf3"
codeBackgroundColor = "#0b1220"
codeTextColor = "#9ecbff"
linkColor = "#58a6ff"
borderColor = "#2b3a4a"

[browser]
gatherUsageStats = false
